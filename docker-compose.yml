services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock # Allow backend to run docker containers
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
    env_file:
      - backend/.env

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080" # Match user's change
    depends_on:
      - backend
